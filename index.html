<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kat Hizmetleri</title>
<style>
:root{
  --bg:#eaf0f0; --surface:#fff; --ink:#13232b; --muted:#5a6c74; --line:#d3dddd;
  --brand:#0f3d3e; --s0:#a4470b; --s0bg:#fcefe0; --s1:#1b4fc4; --s1bg:#e5ecfb;
  --s2:#b07d00; --s2bg:#fff3cc; --s3:#17743d; --s3bg:#e1f3e8; --bad:#a12020; --badbg:#fbe5e5;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:60px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1b4fc4;outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}

header{background:var(--brand);color:#fff;padding:12px 0}
header .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:1.2rem;flex:1}
.pill{background:rgba(255,255,255,.14);border-radius:16px;padding:4px 12px;font-size:.85rem}
.hbtn{background:rgba(255,255,255,.14);border:0;border-radius:6px;color:#fff;padding:6px 10px;font-size:.85rem}
.hbtn[aria-pressed="false"]{opacity:.55}
.demo{background:#fff4d6;border-bottom:1px solid #ecd48a;font-size:.85rem;padding:6px 0}

nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav .wrap{display:flex;gap:2px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:10px;background:var(--s0);color:#fff;font-size:.75rem;text-align:center}

main{max-width:1000px;margin:0 auto;padding:16px 14px}
h2{font-size:1.05rem;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input,select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.grow{flex:1;min-width:170px}
.btn{border:0;border-radius:6px;padding:9px 16px;font-weight:600;background:var(--brand);color:#fff}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{padding:12px 20px;font-size:1rem}
.note{font-size:.85rem;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
tr.fl td{background:#f3f7f7;font-weight:600;color:var(--muted)}
.scroll{overflow-x:auto}
.chk{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--ink)}

.task{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--s0);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.task.t1{border-left-color:var(--s1)} .task.t2{border-left-color:var(--s2)} .task.t3{border-left-color:var(--s3);opacity:.75}
.task .no{font-size:1.3rem;font-weight:700;min-width:54px}
.task .info{flex:1;min-width:130px}
.task .sub{font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:10px;background:#e7eeee;color:var(--brand);margin-right:4px}
.tag.hot{background:var(--badbg);color:var(--bad)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:.82rem}
.cell b{font-size:1.1rem;display:block}
.cell.c0{border-left-color:var(--s0);background:var(--s0bg)} .cell.c1{border-left-color:var(--s1);background:var(--s1bg)}
.cell.c2{border-left-color:var(--s2);background:var(--s2bg)} .cell.c3{border-left-color:var(--s3);background:var(--s3bg)}
.cell.kd,.cell.arizali{border-left-color:var(--bad);background:var(--badbg)} .cell.none{opacity:.65}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-size:1.4rem;line-height:1.1}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tl time{color:var(--muted);min-width:44px}

.login{max-width:380px;margin:40px auto}
.toasts{position:fixed;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast.acil{background:var(--bad)}
.toast button{background:#fff;color:var(--ink);border:0;border-radius:5px;padding:3px 10px}

tr.d-hazir{background:#eef9f1} tr.d-konaklamali{background:#f0f4f7} tr.d-cikis,tr.d-bos{background:#fff3e8} tr.d-arizali{background:#fbe5e5}
.cell.occ{border-left-color:#6f838c;background:#eef2f4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:-4px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.daybar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 0;font-size:.92rem}
.daybar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.daybar #clock{color:var(--muted)}
@media (max-width:640px){.sum{grid-template-columns:repeat(2,1fr)}}
.hotel-logo{display:block;width:min(100%,310px);height:auto;margin:0 auto 16px}.login .hotel-logo{margin-bottom:18px}.brandline{display:flex;align-items:center;gap:14px;min-width:0}.brandline .hotel-logo{width:220px;margin:0}.brandline h1{margin:0;font-size:1.15rem}@media(max-width:640px){.brandline .hotel-logo{width:155px}.brandline{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* =========================================================
   Kat Hizmetleri - demo sürümü (ortak liste)
   Resepsiyon odaları gönderir, kat görevlileri tek ortak ekranı kullanır.
   Kat görevlileri arasında kişi ayrımı yoktur.
   Veriler tarayıcıda (localStorage) saklanır. Gerçek sürümde
   load()/save()/log() Supabase çağrılarıyla değiştirilecek.
   ========================================================= */

const KEY = 'kh-demo-v11';
const ANNEX = ['113','211','212','213','311','312','313','411','412','413'];

/* Ana bina 101-106 ... 401-406 (sonu 6 olan = suit), ek bina = king suit */
const DEFS = {};
for (let f = 1; f <= 4; f++) for (let i = 1; i <= 6; i++)
  DEFS[String(f * 100 + i)] = { bina: 'ana', tip: i === 6 ? 'suit' : 'standart' };
ANNEX.forEach(n => DEFS[n] = { bina: 'ek', tip: 'king suit' });

const TALEP = { tam: 'Tam temizlik', havlu: 'Havlu ve çarşaf değişimi', cop: 'Çöp ve toparlama' };
const DURUM_ANA = { belirsiz: 'Seçiniz', hazir: 'Temiz ve hazır', konaklamali: 'Konaklamalı', cikis: 'Çıkış yaptı (kirli)', bos: 'Boş-kirli' };
const TSTAT = ['Bekliyor', 'Temizleniyor', 'Kontrol bekliyor', 'Kontrol edildi'];
const ONEM = { kritik: 'Kritik', normal: 'Normal', dusuk: 'Düşük' };
const ISTAT = ['Açık', 'Devam ediyor', 'Çözüldü'];
const RECEP = ['resepsiyon', 'yonetici'];
const KATS = ['kat'];

const USERS = [
  { id: 'yonetici',   ad: 'Yönetici',        rol: 'yonetici' },
  { id: 'resepsiyon', ad: 'Resepsiyon',      rol: 'resepsiyon' },
  { id: 'kat',        ad: 'Kat Görevlileri', rol: 'kat' },
  { id: 'teknik',     ad: 'Teknik Personel', rol: 'teknik' }
];
const DEMO_PASS = '1234';
const TABS = {
  yonetici:   [['plan','Sabah planı'],['bugun','Bugün'],['ek','Ek bina'],['ariza','Arızalar'],['gecmis','Geçmiş']],
  resepsiyon: [['plan','Sabah planı'],['bugun','Bugün'],['ek','Ek bina'],['ariza','Arızalar'],['gecmis','Geçmiş']],
  kat:        [['liste','Ortak liste'],['ariza','Arıza bildir']],
  teknik:     [['ariza','Arızalar']]
};

/* ---------- yardımcılar ---------- */
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const hhmm = t => new Date(t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = s => document.querySelector(s);
let noteDraft = {};   /* yazılmakta olan yapılan iş notları, ekran yenilense de kaybolmasın */
const norm = t => String(t || '').trim().toLocaleLowerCase('tr');
let myName = (() => { try { return localStorage.getItem('kh-name') || ''; } catch (e) { return ''; } })();
/* kat görevlisi ekranda yazdığı adla işlem yapar; diğer roller hesap adıyla */
function actor() {
  if (!me) return '';
  if (me.rol !== 'kat') return me.ad;
  const el = document.querySelector('#myName');
  if (el) { myName = el.value.trim(); try { localStorage.setItem('kh-name', myName); } catch (e) {} }
  return myName;
}
const DEV = Math.random().toString(36).slice(2);   /* bu cihaz/sekme: aynı hesabı kullanan iki telefon birbirine bildirim gönderebilsin */
const uname = id => (USERS.find(u => u.id === id) || {}).ad || '-';
const byPrio = (a, b) => b.puan - a.puan || a.oda - b.oda;

/* ---------- veri katmanı ---------- */
function fresh() {
  const rooms = {};
  for (const [no, d] of Object.entries(DEFS))
    rooms[no] = { durum: d.bina === 'ana' ? 'belirsiz' : 'dolu', giris: '', vip: false, kd: false, son: null };
  return { day: iso(Date.now()), rooms, tasks: [], sent: false, issues: [], log: [], archive: {} };
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function loadMe() {
  try { const id = sessionStorage.getItem('kh-me'); return USERS.find(u => u.id === id) || null; } catch (e) { return null; }
}
function setMe(u) { try { u ? sessionStorage.setItem('kh-me', u.id) : sessionStorage.removeItem('kh-me'); } catch (e) {} }

let state = load(), me = loadMe(), tab = null, histDate = null;
let soundOn = true, speakOn = false;

function log(metin, tip, hedef) {
  state.log.push({ t: Date.now(), kim: !me ? 'Sistem' : (me.rol === 'kat' && myName) ? myName : me.ad, dev: DEV, gun: state.day, metin, tip, hedef: hedef || [] });
}

/* ---------- ses ---------- */
let ac;
function audio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}
  return ac;
}
function tone(f, t0, d, v = .15) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(v, a.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t0 + d);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + d);
}
const SOUNDS = {
  yeni:  () => { tone(660, 0, .15); tone(880, .18, .22); },
  bitti: () => tone(523, 0, .35, .1),
  hazir: () => { tone(523, 0, .15); tone(784, .16, .35); },
  acil:  () => { for (let i = 0; i < 3; i++) { tone(988, i * .32, .2, .25); tone(740, i * .32 + .12, .15, .25); } }
};
function toast(msg, sticky, cls) {
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.innerHTML = `<span>${esc(msg)}</span>` + (sticky ? '<button>Tamam</button>' : '');
  $('#toasts').appendChild(el);
  const rm = () => el.remove();
  if (sticky) el.querySelector('button').onclick = rm; else setTimeout(rm, 3800);
}
function notifyNew(oldLen) {
  if (!me) return;
  state.log.slice(oldLen).forEach(e => {
    if (e.dev === DEV) return;
    if (!(e.hedef.includes(me.id) || e.hedef.includes(me.rol))) return;
    if (soundOn && SOUNDS[e.tip]) SOUNDS[e.tip]();
    toast(e.metin, e.tip === 'acil', e.tip === 'acil' ? 'acil' : '');
    if (speakOn && e.tip === 'hazir' && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(e.metin); u.lang = 'tr-TR'; speechSynthesis.speak(u);
    }
  });
}
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const old = state.log.length;
  state = load(); notifyNew(old); render();
});

/* ---------- görev üretimi (ortak liste) ---------- */
function buildTasks(only) {
  const out = []; let id = Date.now();
  for (const [no, d] of Object.entries(DEFS)) {
    if (only && no !== only) continue;
    const r = state.rooms[no];
    const arizali = state.issues.some(x => x.oda === no && x.status < 2);
    if (r.kd || arizali || state.tasks.some(t => t.oda === no)) continue;
    let tur;
    if (d.bina === 'ana') {
      if (r.durum === 'hazir' || r.durum === 'belirsiz') continue;   /* temiz ve hazır ya da seçilmemiş: görev yok */
      tur = r.durum === 'konaklamali' ? 'bakim' : 'tam';
    } else {
      if (r.durum !== 'cikis') continue;
      tur = 'tam';
    }
    let puan = 0;
    if (r.giris) puan += 3; if (r.vip) puan += 2; if (d.tip !== 'standart') puan += 1; if (r.durum !== 'konaklamali') puan += 1;
    out.push({ id: id++, oda: no, tur, puan, giris: r.giris, status: 0 });
  }
  return out;
}

/* ---------- görünümler ---------- */
function viewLogin() {
  return `<div class="login panel">
    <img class="hotel-logo" src="logo-aga-sef.png" alt="Ağaoğlu Oteli logosu"><h2>Kat Hizmetleri</h2>
    <form id="loginForm" class="row" style="flex-direction:column;align-items:stretch">
      <label>Kullanıcı adı<input name="u" autocomplete="username" required></label>
      <label>Şifre<input name="p" type="password" autocomplete="current-password" required></label>
      <button class="btn big" type="submit">Giriş yap</button>
      <p class="note" id="loginErr" style="color:var(--bad);margin:0"></p>
    </form>
    <p class="note"><b>Demo sürümü.</b> Hesaplar: yonetici, resepsiyon, kat, teknik. Hepsinin şifresi 1234. Gerçek sürümde hesapları yönetici açacak ve şifreler sunucuda korunacak.</p>
    <p class="note">İpucu: aynı tarayıcıda iki sekme açıp farklı kullanıcılarla girerseniz anlık uyarıları ve sesleri deneyebilirsiniz. Bu demo sürümü farklı cihazlar arasında veri eşitlemez.</p>
  </div>`;
}

const taskLabel = t => t.tur === 'tam' ? 'Tam temizlik' : t.tur === 'bakim' ? 'Günlük bakım' : (t.alt || 'Talep');
function tags(t) {
  const r = state.rooms[t.oda], d = DEFS[t.oda];
  return (d.tip !== 'standart' ? `<span class="tag">${d.tip}</span>` : '') +
    (d.bina === 'ek' ? '<span class="tag">Ek bina</span>' : '') +
    (r.vip ? '<span class="tag hot">VIP</span>' : '') +
    (t.giris ? `<span class="tag hot">Misafir girişi ${esc(t.giris)}</span>` : '') +
    (t.aralik ? `<span class="tag">${esc(t.aralik)}</span>` : '') +
    (t.acil ? '<span class="tag hot">Acil</span>' : '');
}

/* --- Sabah planı (resepsiyon) --- */
function viewPlan() {
  const locked = no => state.tasks.some(t => t.oda === no);
  const cnt = { hazir: 0, dolu: 0, kirli: 0, belirsiz: 0 };
  let rows = '';
  for (let f = 1; f <= 4; f++) {
    rows += `<tr class="fl"><td colspan="5">${f}. kat</td></tr>`;
    for (let i = 1; i <= 6; i++) {
      const no = String(f * 100 + i), r = state.rooms[no], d = DEFS[no], lk = locked(no) || r.kd;
      cnt[r.durum === 'hazir' ? 'hazir' : r.durum === 'konaklamali' ? 'dolu' : r.durum === 'belirsiz' ? 'belirsiz' : 'kirli']++;
      const arizali = state.issues.some(x => x.oda === no && x.status < 2);
      const odaKapali = lk || arizali;
      rows += `<tr class="d-${r.durum}${arizali ? ' d-arizali' : ''}"><td><b>${no}</b>${arizali ? ' <span class="tag hot">Arızalı · Kullanım dışı</span>' : r.kd ? ' <span class="tag hot">Kullanım dışı</span>' : ''}</td><td>${d.tip}</td>
        <td><select data-act="rdurum" data-room="${no}" ${odaKapali ? 'disabled' : ''} aria-label="${no} durumu">
          ${Object.entries(DURUM_ANA).map(([k, v]) => `<option value="${k}" ${r.durum === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td><input type="time" data-act="rgiris" data-room="${no}" value="${r.giris}" ${odaKapali ? 'disabled' : ''} aria-label="${no} misafir giriş saati"></td>
        <td><input type="checkbox" data-act="rvip" data-room="${no}" ${r.vip ? 'checked' : ''} ${odaKapali ? 'disabled' : ''} aria-label="${no} VIP"></td></tr>`;
    }
  }
  const chips = ANNEX.map(no => {
    const r = state.rooms[no];
    return `<label class="chk"><input type="checkbox" data-act="aexit" data-room="${no}" ${r.durum === 'cikis' ? 'checked' : ''} ${locked(no) ? 'disabled' : ''}> ${no}</label>`;
  }).join('');
  const pending = buildTasks();
  const openIssues = state.issues.filter(x => x.status < 2).sort((a, b) => a.oda.localeCompare(b.oda, 'tr'));
  const issuePanel = openIssues.length ? `<div class="panel" style="border-color:var(--bad)"><h2>Devam eden arızalar · ${openIssues.length}</h2><p class="note">Arıza kapanana kadar bu odalar kullanım dışıdır; temizlik görevine dahil edilmez.</p><div class="scroll"><table><thead><tr><th>Oda</th><th>Arıza</th><th>Önem</th><th>Durum</th><th>Kayıt tarihi</th></tr></thead><tbody>${openIssues.map(x => `<tr class="d-arizali"><td><b>${esc(x.oda)}</b> <span class="tag hot">Kullanım dışı</span></td><td>${esc(x.metin)}</td><td>${esc(ONEM[x.onem] || x.onem || '-')}</td><td>${esc(ISTAT[x.status] || 'Açık')}</td><td>${new Date(x.t).toLocaleDateString('tr-TR')}</td></tr>`).join('')}</tbody></table></div></div>` : '';
  const bulkOpts = Object.entries(DURUM_ANA).filter(([k]) => k !== 'belirsiz').map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  return `
    ${issuePanel}
    ${pending.length ? `<div class="panel" style="border-color:var(--s0);background:var(--s0bg)"><div class="row"><b>${pending.length} oda kat görevlilerine henüz gönderilmedi:</b>
      <span>${pending.slice().sort(byPrio).map(t => t.oda).join(', ')}</span><button class="btn" data-act="send">Ortak listeye gönder</button></div></div>` : ''}
    ${state.sent ? '<p class="note">Bugünkü plan gönderildi. Sonradan işaretlediğiniz odalar da “Ortak listeye gönder” ile listeye eklenir.</p>' : ''}
    <div class="sum"><div><b>${cnt.hazir}</b>Temiz ve hazır</div><div><b>${cnt.dolu}</b>Konaklamalı</div><div><b>${cnt.kirli}</b>Kirli (temizlik gerekli)</div><div><b>${cnt.belirsiz}</b>Seçilmedi</div></div>
    <div class="panel"><h2>Ek bina çıkışları</h2><div class="row">${chips}</div></div>
    <div class="panel"><h2>Ana bina durumları</h2>
      <div class="row" style="margin-bottom:10px"><label>Seçilmeyen odaları toplu ayarla<select id="bulkVal">${bulkOpts}</select></label>
        <button class="btn ghost" data-act="bulk">Uygula</button></div>
      <div class="legend"><span><i style="background:#cfe9d8"></i>Temiz ve hazır: görev yok</span><span><i style="background:#d7e0e6"></i>Konaklamalı: günlük bakım</span><span><i style="background:#fbd9b8"></i>Çıkış / boş-kirli: tam temizlik</span></div>
      <div class="scroll"><table>

/* --- Bugün (resepsiyon) --- */
function roomCat(no) {
  const r = state.rooms[no], d = DEFS[no];
  if (state.issues.some(i => i.oda === no && i.status < 2)) return 'kd';
  if (r.kd) return 'kd';
  const t = state.tasks.filter(x => x.oda === no).slice(-1)[0];
  if (t && t.status === 2) return 'kontrol';
  if (t && t.status < 2) return t.tur === 'bakim' || t.tur === 'talep' ? 'dolu' : 'kirli';
  if (d.bina === 'ana') return r.durum === 'hazir' ? 'hazir' : r.durum === 'konaklamali' ? 'dolu' : r.durum === 'belirsiz' ? 'belirsiz' : 'kirli';
  return r.durum === 'dolu' ? 'dolu' : r.durum === 'cikis' ? 'kirli' : 'hazir';
}
function cellInfo(no) {
  const cat = roomCat(no), d = DEFS[no];
  const t = state.tasks.filter(x => x.oda === no).slice(-1)[0];
  const who = t && t.status === 1 && t.baslayan ? ' · ' + esc(t.baslayan) : t && t.status === 2 && t.bitiren ? ' · ' + esc(t.bitiren) : '';
  const base = d.bina === 'ek' ? 'Dolu' : 'Konaklamalı';
  if (cat === 'kd') {
    const openFault = state.issues.some(i => i.oda === no && i.status < 2);
    return ['kd', openFault ? 'Arızalı · kullanım dışı' : 'Kullanım dışı'];
  }
  if (cat === 'kontrol') return ['c2', 'Temiz, kontrol bekliyor' + who];
  if (cat === 'kirli') return t ? (t.status === 1 ? ['c1', 'Temizleniyor' + who] : ['c0', 'Kirli, sırada']) : ['c0', 'Kirli, görev gönderilmedi'];
  if (cat === 'dolu') {
    if (t && t.status === 1) return ['occ', base + ', işlemde' + who];
    if (t && t.status === 0) return ['occ', base + ', bakım bekliyor'];
    if (t && t.status === 3) return ['occ', base + ', bakım tamam'];
    return ['occ', base + (d.bina === 'ana' && state.rooms[no].durum === 'konaklamali' ? ', bakım gönderilmedi' : '')];
  }
  if (cat === 'hazir') return ['c3', 'Temiz ve hazır'];
  return ['none', 'Durum seçilmedi'];
}

/* --- Geçmiş --- */
const dayLabel = d => new Date(d + 'T12:00').toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const dayShort = d => new Date(d + 'T12:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });

/* bir çalışma gününün tüm verisi (arşiv + açıksa şu anki kayıtlar) */
function dayData(d) {
  const a = state.archive[d] || {}, open = d === state.day;
  const iss = new Map();
  (a.issues || []).forEach(i => iss.set(i.id, i));
  if (open) state.issues.forEach(i => iss.set(i.id, i));
  return {
    tasks: [...new Map([...(a.tasks || []), ...(open ? state.tasks : [])].map(t => [t.id, t])).values()],   /* aynı görev iki kez sayılmasın */
    issues: [...iss.values()],
    rooms: a.rooms || null, kapanis: a.kapanis, kapatan: a.kapatan, open,
    evs: state.log.filter(e => (e.gun || iso(e.t)) === d)
  };
}
/* Geçmiş sayfasında görünen her şey buradan hesaplanır; ekran ve CSV aynı veriyi kullanır */
function dayStats(d) {
  const x = dayData(d), tasks = x.tasks;
  const total = tasks.length, done = tasks.filter(t => t.status >= 2).length;
  const ppl = {};
  const bump = (name, k) => { if (!name) return; const key = norm(name); (ppl[key] = ppl[key] || { n: name, c: 0, k: 0 })[k]++; };
  tasks.forEach(t => { bump(t.bitiren, 'c'); bump(t.kontrolEden, 'k'); });
  const summary = [['Temizlenen oda', done], ['Kontrol edilen oda', tasks.filter(t => t.status === 3).length], ['Kontrol bekleyen oda', tasks.filter(t => t.status === 2).length], ['Bekleyen ya da devreden oda', tasks.filter(t => t.status < 2).length]];
  let end = '', endCounts = null;
  if (x.rooms) {
    const c = { hazir: 0, dolu: 0, kirli: 0, belirsiz: 0 };
    Object.entries(x.rooms).forEach(([no, du]) => {
      c[DEFS[no].bina === 'ana' ? (du === 'hazir' ? 'hazir' : du === 'konaklamali' ? 'dolu' : du === 'belirsiz' ? 'belirsiz' : 'kirli')
        : (du === 'dolu' ? 'dolu' : du === 'cikis' ? 'kirli' : 'hazir')]++;
    });
    endCounts = c;
    end = `Gün sonu oda durumu: ${c.hazir} temiz ve hazır, ${c.dolu} konaklamalı/dolu, ${c.kirli} kirli${c.belirsiz ? ', ' + c.belirsiz + ' seçilmemiş' : ''}.`;
  }
  const when = ts => new Date(ts).toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  const status = x.open ? (x.kapanis ? `Açık gün. Bu gün daha önce ${when(x.kapanis)} saatinde kapatıldı (${x.kapatan || '-'}), kayıtlar birleşik gösteriliyor.` : 'Açık gün, henüz kapatılmadı.')
    : x.kapanis ? `Kapatıldı: ${when(x.kapanis)}, ${x.kapatan || '-'}.`
    : (tasks.length || x.evs.length ? 'Arşivlenmiş gün.' : 'Bu tarihte kayıt yok.');
  return { x, total, done, people: Object.values(ppl), summary, end, endCounts, status };
}
const taskRow = t => [t.oda, DEFS[t.oda].bina === 'ana' ? 'Ana bina' : 'Ek bina', DEFS[t.oda].tip, taskLabel(t), t.bitiren || '', t.kontrolEden || (t.checkedBy ? uname(t.checkedBy) : ''), TSTAT[t.status]];
const issueRow = i => [i.oda, ONEM[i.onem], i.metin, i.byName || uname(i.by), ISTAT[i.status], i.not || '', i.notYazan || ''];

/* tam rapor: Geçmiş sayfasındaki bütün bölümler tek dosyada */
function fullCsvRows(d) {
  const st = dayStats(d), x = st.x, rows = [];
  const sec = t => { if (rows.length) rows.push([]); rows.push([t]); };
  sec('GÜN RAPORU');
  rows.push(['Tarih', d]); rows.push(['Gün', dayLabel(d)]); rows.push(['Durum', st.status]); rows.push(['Toplam oda görevi', st.total]);
  sec('ÖZET'); rows.push(['Özet', 'Oda sayısı']); st.summary.forEach(r => rows.push(r));
  if (st.endCounts) {
    const c = st.endCounts;
    sec('GÜN SONU ODA DURUMU'); rows.push(['Durum', 'Oda sayısı']);
    rows.push(['Temiz ve hazır', c.hazir], ['Konaklamalı / dolu', c.dolu], ['Kirli', c.kirli]);
    if (c.belirsiz) rows.push(['Seçilmemiş', c.belirsiz]);
  }
  sec('KİŞİ BAZINDA'); rows.push(['Ad', 'Temizlediği oda', 'Kontrol ettiği oda']);
  if (st.people.length) st.people.forEach(p => rows.push([p.n, p.c, p.k])); else rows.push(['Kayıt yok']);
  sec('ODA KAYITLARI'); rows.push(['Oda', 'Bina', 'Oda tipi', 'İş', 'Temizleyen', 'Kontrol eden', 'Durum']);
  if (x.tasks.length) x.tasks.slice().sort((a, b) => a.oda - b.oda).forEach(t => rows.push(taskRow(t))); else rows.push(['Kayıt yok']);
  sec('ARIZALAR'); rows.push(['Oda', 'Önem', 'Sorun', 'Bildiren', 'Durum', 'Yapılan iş', 'İşi yapan']);
  if (x.issues.length) x.issues.forEach(i => rows.push(issueRow(i))); else rows.push(['Kayıt yok']);
  sec('OLAYLAR'); rows.push(['Saat', 'Kim', 'Olay']);
  if (x.evs.length) x.evs.forEach(e => rows.push([hhmm(e.t), e.kim, e.metin])); else rows.push(['Kayıt yok']);
  return rows;
}
function csvRows(kind, d) {
  if (kind === 'tam') return fullCsvRows(d);
  const x = dayData(d);
  if (kind === 'ariza')
    return [['Tarih', 'Oda', 'Önem', 'Sorun', 'Bildiren', 'Durum', 'Yapılan iş', 'İşi yapan'], ...x.issues.map(i => [d, ...issueRow(i)])];
  return [['Tarih', 'Oda', 'Bina', 'Oda tipi', 'İş', 'Temizleyen', 'Kontrol eden', 'Durum'],
    ...x.tasks.slice().sort((a, b) => a.oda - b.oda).map(t => [d, ...taskRow(t)])];
}
function downloadCsv(name, rows) {
  /* =, +, -, @ ile başlayan metin Excel'de formül sayılmasın */
  const q = v => { let t = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
  const text = '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function viewHistory() {
  const archived = Object.keys(state.archive).sort().reverse();
  const d = histDate || archived[0] || state.day;
  const st = dayStats(d), x = st.x, tasks = x.tasks, total = st.total, done = st.done;
  const pplRows = st.people.map(p => `<tr><td>${esc(p.n)}</td><td>${p.c}</td><td>${p.k}</td></tr>`).join('');
  const sumRows = st.summary.map(([n, v]) => `<tr><td>${n}</td><td>${v}</td></tr>`).join('');
  const endLine = st.end ? `<p class="note">${esc(st.end)}</p>` : '';
  const status = esc(st.status);
  const recs = tasks.length ? `<div class="scroll"><table><thead><tr><th>Oda</th><th>İş</th><th>Temizleyen</th><th>Kontrol eden</th><th>Durum</th></tr></thead><tbody>${
    tasks.slice().sort((a, b) => a.oda - b.oda).map(t =>
      `<tr><td><b>${t.oda}</b></td><td>${taskLabel(t)}</td><td>${esc(t.bitiren || '-')}</td><td>${esc(t.kontrolEden || (t.checkedBy ? uname(t.checkedBy) : '-'))}</td><td>${TSTAT[t.status]}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">Bu tarihte oda kaydı yok.</div>';
  const issues = x.issues.length ? `<div class="scroll"><table><thead><tr><th>Oda</th><th>Önem</th><th>Sorun</th><th>Bildiren</th><th>Durum</th><th>Yapılan iş</th></tr></thead><tbody>${
    x.issues.map(i => `<tr><td><b>${esc(i.oda)}</b></td><td>${ONEM[i.onem]}</td><td>${esc(i.metin)}</td><td>${esc(i.byName || uname(i.by))}</td><td>${ISTAT[i.status]}</td><td>${esc(i.not || '-')}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">Bu tarihte arıza kaydı yok.</div>';
  const chips = [state.day, ...archived.filter(k => k !== state.day)].slice(0, 15).map(k => {
    const n = dayData(k).tasks.length;
    return `<button class="btn ${d === k ? '' : 'ghost'} small" data-act="hist" data-d="${k}">${dayShort(k)}${k === state.day ? ' (açık)' : ''} · ${n} oda</button>`;
  }).join('');
  return `
    <div class="panel"><h2>Arşivlenen günler</h2><div class="row">${chips}</div>
      <div class="row" style="margin-top:10px"><label>Başka tarih seç<input type="date" data-act="histpick" value="${d}"></label></div></div>
    <div class="panel"><h2>${dayLabel(d)}</h2>
      <p class="note">${status} Toplam ${total} oda, ${done} tanesi temizlendi.</p>${endLine}
      <div class="scroll"><table><thead><tr><th>Özet</th><th>Oda sayısı</th></tr></thead><tbody>${sumRows}</tbody></table></div>
      ${pplRows ? `<h2 style="margin-top:14px">Kişi bazında</h2><div class="scroll"><table><thead><tr><th>Ad</th><th>Temizlediği oda</th><th>Kontrol ettiği oda</th></tr></thead><tbody>${pplRows}</tbody></table></div>` : ''}
      <div class="row" style="margin-top:12px"><button class="btn" data-act="csv" data-kind="tam" data-d="${d}" ${total || x.issues.length || x.evs.length ? '' : 'disabled'}>Tam raporu indir (Excel/CSV)</button>
        <button class="btn ghost small" data-act="csv" data-kind="oda" data-d="${d}" ${total ? '' : 'disabled'}>Yalnız oda kayıtları</button>
        <button class="btn ghost small" data-act="csv" data-kind="ariza" data-d="${d}" ${x.issues.length ? '' : 'disabled'}>Yalnız arızalar</button></div>
      <p class="note">Tam rapor bu sayfadaki özet, gün sonu oda durumu, kişi bazında döküm, oda kayıtları, arızalar ve olay akışının tamamını içerir.</p></div>
    <div class="panel"><h2>Oda kayıtları</h2>${recs}</div>
    <div class="panel"><h2>Arızalar</h2>${issues}</div>
    <div class="panel"><h2>Olaylar</h2>${x.evs.length ? `<ul class="tl">${x.evs.map(e => `<li><time>${hhmm(e.t)}</time><span><b>${esc(e.kim)}:</b> ${esc(e.metin)}</span></li>`).join('')}</ul>` : '<div class="empty">Bu tarihte kayıtlı işlem yok.</div>'}</div>`;
}

/* ---------- ana çizim ---------- */
function render() {
  const mn = document.querySelector('#myName'); if (mn) myName = mn.value;   /* yazılan ad, yenilemede kaybolmasın */
  if (!me) { $('#root').innerHTML = viewLogin(); return; }
  const tabs = TABS[me.rol];
  if (!tab || !tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const openIssues = state.issues.filter(i => i.status < 2).length;
  const views = { plan: viewPlan, bugun: viewToday, ek: viewAnnex, ariza: viewIssues, gecmis: viewHistory, liste: viewMine };
  const isRecep = RECEP.includes(me.rol);
  const unsent = isRecep ? buildTasks().length : 0;
  $('#root').innerHTML = `
    <header><div class="wrap">
      <div class="brandline"><img class="hotel-logo" src="logo-aga-sef.png" alt="Ağaoğlu Oteli logosu"><h1>Kat Hizmetleri</h1></div>
      <span class="pill">${esc(me.ad)}</span>
      <button class="hbtn" data-act="sound" aria-pressed="${soundOn}">Ses ${soundOn ? 'açık' : 'kapalı'}</button>
      ${isRecep ? `<button class="hbtn" data-act="speak" aria-pressed="${speakOn}">Sesli okuma ${speakOn ? 'açık' : 'kapalı'}</button>` : ''}
      <button class="hbtn" data-act="logout">Çıkış</button>
    </div></header>
    <div class="daybar"><div class="wrap">
      <b>${dayLabel(iso(Date.now()))}</b><span id="clock">${hhmm(Date.now())}</span>
      ${isRecep ? '<button class="btn small ghost" data-act="newday">Günü kapat</button>' : ''}
    </div></div>
    <div class="demo"><div class="wrap">Demo sürümü: veriler yalnızca bu tarayıcıda saklanır; farklı cihazlar arasında eşitleme ve gerçek kullanıcı doğrulaması henüz yoktur.</div></div>
    <nav><div class="wrap" role="tablist">${tabs.map(([k, n]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${k === tab}">${n}${k === 'plan' && unsent ? `<span class="badge">${unsent}</span>` : ''}${k === 'ariza' && openIssues ? `<span class="badge">${openIssues}</span>` : ''}${k === 'bugun' && me.rol === 'yonetici' && state.tasks.some(t => t.status === 2) ? `<span class="badge">${state.tasks.filter(t => t.status === 2).length}</span>` : ''}</button>`).join('')}</div></nav>
    <main>${views[tab]()}</main>`;
}

/* gün kapatma: kayıtlar arşive alınır, yeni gün başlar. Gün değişince kendiliğinden de çalışır (gece vardiyası yok). */
function closeDay(by) {
  log(by.startsWith('Otomatik') ? 'Gün otomatik kapatıldı (gün değişimi)' : 'Gün kapatıldı', 'bitti', []);
  const carried = state.tasks.filter(t => DEFS[t.oda].bina === 'ek' && t.status < 3);   /* kontrolü bitmemiş ek bina işleri devreder */
  const snap = {}; Object.entries(state.rooms).forEach(([no, r]) => snap[no] = r.durum);
  const prev = state.archive[state.day] || {};
  const im = new Map(); (prev.issues || []).forEach(i => im.set(i.id, i)); state.issues.forEach(i => im.set(i.id, i));
  state.archive[state.day] = { tasks: [...new Map([...(prev.tasks || []), ...state.tasks].map(t => [t.id, t])).values()], issues: [...im.values()], rooms: snap, kapanis: Date.now(), kapatan: by };
  for (const [no, d] of Object.entries(DEFS)) {
    const r = state.rooms[no];
    if (d.bina === 'ana') {
      const open = state.tasks.some(t => t.oda === no && t.status < 3 && t.tur === 'tam');
      if (r.durum === 'cikis' || open) r.durum = 'bos';   /* temizlenmemiş oda kirli kalır */
      r.giris = ''; r.vip = false;
    }
    else if (r.durum === 'cikis' && !carried.some(t => t.oda === no)) r.durum = 'musait';
  }
  state.tasks = carried; state.sent = false; state.day = iso(Date.now());
  state.issues = state.issues.filter(i => i.status < 2);
  histDate = null;
}
function autoRollover() {
  if (state.day === iso(Date.now())) return false;
  closeDay('Otomatik (gün değişimi)'); save(); return true;
}

/* ---------- olaylar ---------- */
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === 'loginForm') {
    const u = USERS.find(x => x.id === String(f.get('u')).trim().toLowerCase());
    if (!u || f.get('p') !== DEMO_PASS) { $('#loginErr').textContent = 'Kullanıcı adı ya da şifre hatalı.'; return; }
    me = u; setMe(u); tab = null; audio(); render(); return;
  }
  if (e.target.id === 'issueForm') {
    const metin = String(f.get('metin')).trim(); if (!metin) return;
    const i = { id: Date.now(), oda: f.get('oda'), onem: f.get('onem'), metin, status: 0, by: me.id, byName: actor() || me.ad, t: Date.now() };
    state.issues.push(i);
    if (i.onem === 'kritik') {
      if (DEFS[i.oda]) {
        state.rooms[i.oda].kd = true;
        state.tasks = state.tasks.filter(t => !(t.oda === i.oda && t.status === 0));
      }
      log(`Kritik arıza (${i.byName}): ${i.oda}, ${metin}`, 'acil', ['teknik', ...RECEP]);
    } else log(`Yeni arıza (${i.byName}): ${i.oda}, ${metin}`, 'yeni', ['teknik', ...RECEP]);
    save(); toast('Arıza kaydedildi.'); render(); return;
  }
  if (e.target.id === 'talepForm') {
    const acil = !!f.get('acil'), alt = TALEP[f.get('hizmet')];
    state.tasks.push({ id: Date.now(), oda: f.get('oda'), tur: 'talep', alt: alt + ' (talep)', puan: acil ? 5 : 2, giris: '', aralik: f.get('b') + '–' + f.get('e'), acil, status: 0 });
    log(`Ek bina talebi: ${f.get('oda')}, ${alt}, ${f.get('b')}–${f.get('e')}${acil ? ' (ACİL)' : ''}`, acil ? 'acil' : 'yeni', KATS);
    save(); toast('Talep ortak listeye eklendi.'); render();
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-act="inote"]'); if (el) noteDraft[el.dataset.id] = el.value;
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, r = state.rooms[el.dataset.room];
  if (a === 'myname') { actor(); return; }
  if (a === 'inote') { const i = state.issues.find(x => x.id === +el.dataset.id); if (i) { i.not = el.value.trim(); i.notYazan = actor(); save(); } return; }
  if (a === 'rdurum') r.durum = el.value;
  else if (a === 'rgiris') r.giris = el.value;
  else if (a === 'rvip') r.vip = el.checked;
  else if (a === 'aexit') r.durum = el.checked ? 'cikis' : 'dolu';
  else if (a === 'histpick') { histDate = el.value; render(); return; }
  else return;
  save(); render();
});

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = +el.dataset.id;
  const task = state.tasks.find(t => t.id === id);

  if (a === 'sound') { soundOn = !soundOn; if (soundOn) SOUNDS.hazir(); render(); return; }
  if (a === 'speak') { speakOn = !speakOn; render(); return; }
  if (a === 'logout') { me = null; setMe(null); render(); return; }
  if (a === 'hist') { histDate = el.dataset.d; render(); return; }
  if (a === 'csv') { downloadCsv(`kat-hizmetleri-${el.dataset.kind === 'tam' ? 'rapor' : el.dataset.kind}-${el.dataset.d}.csv`, csvRows(el.dataset.kind, el.dataset.d)); return; }

  const who = actor();
  if (me.rol === 'kat' && ['start', 'finish'].includes(a) && !who) {
    toast('Önce adınızı yazın.'); const inp = $('#myName'); if (inp) inp.focus(); return;
  }
  if (a === 'bulk') {
    const v = $('#bulkVal').value; let k = 0;
    for (const [no, d] of Object.entries(DEFS)) {
      const r = state.rooms[no];
      if (d.bina === 'ana' && r.durum === 'belirsiz' && !state.tasks.some(t => t.oda === no)) { r.durum = v; k++; }
    }
    toast(k ? `${k} odanın durumu “${DURUM_ANA[v]}” yapıldı.` : 'Seçilmemiş oda yok.');
  }
  else if (a === 'send') {
    const list = buildTasks(); if (!list.length) return;
    state.tasks.push(...list); state.sent = true;
    log(`${list.length} yeni oda ortak listeye eklendi`, 'yeni', KATS);
    toast('Odalar kat görevlilerine gönderildi.');
  }
  else if (a === 'start') {
    if (!task || task.status !== 0) { toast('Bu odaya başka bir görevli başladı.'); render(); return; }
    task.status = 1; task.startedAt = Date.now(); task.baslayan = who;
    log(`${task.oda} odasına ${who} başladı`, 'bilgi', KATS);
  }
  else if (a === 'finish') {
    if (task.status !== 1) { render(); return; }
    task.status = 2; task.doneAt = Date.now(); task.bitiren = who;
    log(`${task.oda} temiz, kontrol bekliyor (${who})`, 'bitti', [...RECEP, ...KATS]);
  }
  else if (a === 'check') {
    if (task.status !== 2) { render(); return; }
    if (me.rol !== 'yonetici') { toast('Kontrol yalnızca yönetici yetkisindedir.'); return; }
    task.status = 3; task.checkedBy = me.id; task.checkedAt = Date.now(); task.kontrolEden = who;
    state.rooms[task.oda].son = Date.now();
    if (DEFS[task.oda].bina === 'ek' && task.tur === 'tam') state.rooms[task.oda].durum = 'musait';
    if (DEFS[task.oda].bina === 'ana' && task.tur === 'tam') state.rooms[task.oda].durum = 'hazir';
    log(`${task.oda} hazır, kontrol edildi (${who})`, 'hazir', RECEP);
  }
  else if (a === 'aout') {
    const no = el.dataset.room;
    state.rooms[no].durum = 'cikis';
    const list = buildTasks(no); state.tasks.push(...list);
    log(`Ek bina ${no} çıkış yaptı, ortak listeye eklendi`, 'yeni', KATS);
    toast('Oda ortak listeye düştü.');
  }
  else if (a === 'ain') state.rooms[el.dataset.room].durum = 'dolu';
  else if (a === 'inext') {
    if (!['teknik', 'yonetici'].includes(me.rol)) { toast('Arıza işlemini yalnızca teknik personel yapabilir.'); return; }
    const i = state.issues.find(x => x.id === id);
    if (!i || i.status >= 2) { render(); return; }            /* çözülen arıza yeniden açılamaz */
    if (i.status === 0) {
      i.status = 1;
      if (i.onem === 'kritik' && DEFS[i.oda]) state.rooms[i.oda].kd = true;
      log(`Arıza işleme alındı: ${i.oda}, ${i.metin}`, 'bilgi', [...RECEP, i.by]);
    } else {
      const inp = document.querySelector(`[data-act="inote"][data-id="${id}"]`);
      const note = ((inp ? inp.value : (noteDraft[id] !== undefined ? noteDraft[id] : i.not)) || '').trim();
      if (!note) { toast('Çözüldü demeden önce yapılan işi not alanına yazın.'); if (inp) inp.focus(); return; }
      i.not = note; i.notYazan = who; i.cozum = Date.now(); i.status = 2;
      delete noteDraft[id];
      if (DEFS[i.oda] && !state.issues.some(x => x.oda === i.oda && x.onem === 'kritik' && x.status < 2)) state.rooms[i.oda].kd = false;
      log(`Arıza çözüldü: ${i.oda}, ${i.metin}. Yapılan iş: ${note}`, 'hazir', [...RECEP, i.by]);
    }
  }
  else if (a === 'newday') {
    const openMain = state.tasks.filter(t => t.status < 3 && DEFS[t.oda].bina === 'ana').length;
    if (!confirm(`${dayLabel(state.day)} günü kapatılsın mı?\n\nKayıtlar arşive alınır.${openMain ? ' ' + openMain + ' ana bina görevi tamamlanmadı veya yönetici kontrolünden geçmedi; bu odalar kirli kalır.' : ''} Tamamlanmayan ek bina işleri ertesi güne devreder. Gün değişince bu işlem kendiliğinden de yapılır.`)) return;
    closeDay(actor() || me.ad);
  }
  else return;
  save(); render();
});

setInterval(() => {
  const c = $('#clock'); if (c) c.textContent = hhmm(Date.now());
  if (autoRollover()) render();
}, 20000);

autoRollover();
render();
</script>
</body>
</html>
